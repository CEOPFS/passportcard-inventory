version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - JWT_SECRET=wakebot-secret-key-change-in-prod
      - DB_PATH=/app/data/wakebot.db
      - PORT=5000

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
