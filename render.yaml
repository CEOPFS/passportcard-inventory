services:
  - type: web
    name: wakebot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
    disk:
      name: wakebot-data
      mountPath: /app/data
      sizeGB: 1
