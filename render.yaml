databases:
  - name: wakebot-db
    plan: free

services:
  - type: web
    name: wakebot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: wakebot-db
          property: connectionString
